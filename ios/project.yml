# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
name: LugipodTeacher
options:
  bundleIdPrefix: com.itaybraha
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3
  Daily:
    url: https://github.com/daily-co/daily-client-ios
    exactVersion: 0.41.0

targets:
  LugipodTeacher:
    type: application
    platform: iOS
    sources:
      - path: LugipodTeacher
        excludes:
          - "PrivacyInfo.xcprivacy"
      # Code shared with the Share Extension (token bridge, upload model, the share screen).
      - path: Shared
      # Privacy manifest (required for App Store / TestFlight uploads).
      - path: LugipodTeacher/PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/LugipodTeacher.xcconfig
      Release: Config/LugipodTeacher.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Daily
        product: Daily
      - package: Daily
        product: DailySystemBroadcast
      - target: LugipodScreenCapture
      - target: LugipodShare
    entitlements:
      path: LugipodTeacher/LugipodTeacher.entitlements
      properties:
        com.apple.security.application-groups: [group.com.itaybraha.lugipod]
        keychain-access-groups: [$(AppIdentifierPrefix)com.itaybraha.lugipod.shared]
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.teacher
        PRODUCT_NAME: LugipodTeacher
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LugipodTeacher/Info.plist
      properties:
        CFBundleDisplayName: לוגיפוד למורים
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Keeps the teacher's microphone (the native client) alive while Notability is in front.
        UIBackgroundModes: [audio]
        UIAppFonts: [Heebo.ttf]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: הצגת המצלמה שלך לתלמידים בשיעור.
        NSMicrophoneUsageDescription: כדי שהתלמידים ישמעו אותך בשיעור, גם כשאת/ה עובד/ת באפליקציה אחרת.
        LugipodBaseURL: $(LUGIPOD_BASE_URL)
        LugipodSupabaseHost: $(SUPABASE_PROJECT_HOST)
        LugipodSupabaseKey: $(SUPABASE_PUBLISHABLE_KEY)
        LugipodKeychainGroup: $(AppIdentifierPrefix)com.itaybraha.lugipod.shared
        RTCAppGroupIdentifier: group.com.itaybraha.lugipod
        DailyScreenCaptureExtensionBundleIdentifier: com.itaybraha.lugipod.teacher.screen

  LugipodScreenCapture:
    type: app-extension
    platform: iOS
    sources:
      - path: LugipodScreenCapture
    dependencies:
      - package: Daily
        product: DailySystemBroadcast
    entitlements:
      path: LugipodScreenCapture/LugipodScreenCapture.entitlements
      properties:
        com.apple.security.application-groups: [group.com.itaybraha.lugipod]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.teacher.screen
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: LugipodScreenCapture/Info.plist
      properties:
        CFBundleDisplayName: שיתוף מסך
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer

  # "Share → לוגיפוד" (Notability quick share, Files, Photos): attach a PDF to a lesson's summary.
  LugipodShare:
    type: app-extension
    platform: iOS
    sources:
      - path: LugipodShare
        excludes:
          - "PrivacyInfo.xcprivacy"
      - path: LugipodShare/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: LugipodTeacher/DesignSystem.swift
      - path: LugipodTeacher/Fonts/Heebo.ttf
        buildPhase: resources
    configFiles:
      Debug: Config/LugipodTeacher.xcconfig
      Release: Config/LugipodTeacher.xcconfig
    entitlements:
      path: LugipodShare/LugipodShare.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.itaybraha.lugipod.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.teacher.share
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: LugipodShare/Info.plist
      properties:
        CFBundleDisplayName: לוגיפוד
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Heebo.ttf]
        LugipodBaseURL: $(LUGIPOD_BASE_URL)
        LugipodKeychainGroup: $(AppIdentifierPrefix)com.itaybraha.lugipod.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image").@count >= 1).@count >= 1

  LugipodTeacherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LugipodTeacherTests
    dependencies:
      - target: LugipodTeacher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.teacher.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LugipodTeacher.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/LugipodTeacher

  LugipodTeacherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LugipodTeacherUITests
    dependencies:
      - target: LugipodTeacher
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itaybraha.lugipod.teacher.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LugipodTeacher

schemes:
  LugipodTeacher:
    build:
      targets:
        LugipodTeacher: all
        LugipodTeacherTests: [test]
        LugipodTeacherUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LugipodTeacherTests
        - LugipodTeacherUITests
